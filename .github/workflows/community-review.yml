name: Community review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: community-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approval:
    name: Require maintainer approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check community track approval
        uses: actions/github-script@v9
        with:
          script: |
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              },
            );

            const touchesCommunityTracks = files.some(({ filename }) =>
              filename.startsWith("communityTracks/"),
            );

            if (!touchesCommunityTracks) {
              core.notice("No community track files changed; approval label is not required.");
              return;
            }

            const labels = context.payload.pull_request.labels.map(({ name }) => name);
            const isApproved = labels.includes("status:approved");

            if (context.payload.action === "synchronize" && isApproved) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: "status:approved",
              });
              core.setFailed(
                "New commits invalidate community approval. A maintainer must review and reapply status:approved.",
              );
              return;
            }

            if (!isApproved) {
              core.setFailed(
                "Community track changes require the maintainer label status:approved.",
              );
              return;
            }

            core.notice("Community track changes have maintainer approval.");
