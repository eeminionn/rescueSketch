name: Feature proposal / Propuesta de funcionalidad
description: Propose a focused improvement with a clear user outcome.
title: '[Feature]: '
labels:
  - 'type:feature'
  - 'status:triage'
body:
  - type: markdown
    attributes:
      value: |
        Describe the need before the implementation. Larger proposals may be redirected to a Discussion.
        Describe primero la necesidad. Las propuestas grandes pueden trasladarse a una Discussion.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Problema
      description: Who is affected, what are they trying to do, and what blocks them?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome / Resultado deseado
      description: State observable acceptance criteria without prescribing unnecessary implementation.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area / Área
      options:
        - Editor and canvas / Editor y lienzo
        - Rules and validation / Reglas y validación
        - Export and fabrication / Exportación y fabricación
        - Authentication and public save / Autenticación y guardado público
        - Gallery and dashboard / Galería y panel principal
        - Accessibility and i18n / Accesibilidad e i18n
        - Documentation and community / Documentación y comunidad
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / Alternativas consideradas
      description: Include current workarounds and important trade-offs.

  - type: dropdown
    id: rulesImpact
    attributes:
      label: Rules impact / Impacto reglamentario
      options:
        - None known / Ninguno conocido
        - Changes presentation only / Solo cambia la presentación
        - May change validation or rules data / Puede cambiar validación o datos
        - Unsure / No está claro
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks / Comprobaciones
      options:
        - label: I searched existing issues and discussions. / Busqué issues y discusiones existentes.
          required: true
        - label: I understand RescueSketch cannot define new RoboCup requirements. / Entiendo que RescueSketch no puede definir requisitos de RoboCup.
          required: true
