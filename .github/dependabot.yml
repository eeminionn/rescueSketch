version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Santiago
    # Keep security updates enabled while silencing routine version-update PRs.
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - area:tooling
    commit-message:
      prefix: 'build(deps)'
    groups:
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: America/Santiago
    # Security update PRs are not subject to this version-update limit.
    open-pull-requests-limit: 0
    labels:
      - dependencies
      - area:tooling
    commit-message:
      prefix: 'ci(deps)'
    groups:
      github-actions:
        patterns:
          - '*'
